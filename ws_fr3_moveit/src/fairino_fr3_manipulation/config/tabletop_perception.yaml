tabletop_perception:
  ros__parameters:
    # OAK-D Pro W topics (depthai-ros names; depth aligned to RGB)
    depth_topic: /oak/stereo/image_raw
    rgb_topic: /oak/rgb/image_raw
    camera_info_topic: /oak/rgb/camera_info
    world_frame: world

    # The only pre-configured object: the tabletop (world frame).
    table.top_z: 1.0
    table.x_range: [0.56, 1.56]   # real table 1.00 x 0.50 m
    table.y_range: [0.39, 0.89]
    table.edge_margin: 0.02

    # The tabletop plane is refitted every frame from points within
    # plane_search of top_z; heights are measured from that plane.
    table.plane_search: 0.03

    # Points kept: 12 mm .. 40 cm above the fitted table (ignores the flat
    # AprilTag and ~2.5 sigma of depth noise).
    min_height: 0.012
    max_height: 0.40
    depth_range: [0.2, 3.0]
    pixel_stride: 2
    # Median filter on depth (3 or 5); real OAK stereo depth is noisy too.
    depth_median_kernel: 5
    voxel_size: 0.005
    min_cluster_voxels: 25
    # Convex-hull / bounding-rectangle area: ~1.0 box, ~0.785 cylinder.
    cylinder_fill_ratio: 0.9
    # Box footprint from points within this band below the top face.
    top_face_band: 0.01

    # Robot self-filter: points within this distance of the robot's collision
    # meshes are dropped, plus a sphere around the TCP for a carried object.
    robot_filter_distance: 0.02
    robot_sample_spacing: 0.01
    carried_object_radius: 0.09
    tcp_link: grasp_frame

    # Gripper: jaws open 68 mm; objects need this much spare to be graspable.
    gripper_max_opening: 0.068
    grasp_margin: 0.006

    # Tracking and MoveIt scene updates
    update_rate: 2.0
    match_distance: 0.04
    forget_after: 2.0
    # A new object must be seen in this many consecutive updates.
    min_confirmations: 3
    # Perceive only while the robot is still (all |joint velocity| below
    # max_joint_speed for still_time s); moving arm edges look like objects.
    max_joint_speed: 0.01
    still_time: 0.5
    scene_update_position: 0.005
    scene_update_yaw: 0.05
    scene_update_size: 0.006
    # Added to each side in MoveIt. Camera sizes can be ~15 mm short (tapered
    # ends of a scanned mouse fall below min_height), so keep the arm 2 cm away.
    collision_padding: 0.02
    use_sim_time: true
