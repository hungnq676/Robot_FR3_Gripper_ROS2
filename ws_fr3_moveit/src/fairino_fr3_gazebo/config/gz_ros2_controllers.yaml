controller_manager:
  ros__parameters:
    update_rate: 100
    use_sim_time: true

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    gripper_controller:
      type: joint_trajectory_controller/JointTrajectoryController

joint_state_broadcaster:
  ros__parameters:
    # Only real joints. gz_ros2_control (humble) exposes the mimic jaw as
    # "joint_clamp_2_mimic", which MoveIt rejects on every message; the jaw's
    # pose follows from the URDF <mimic> in robot_state_publisher and MoveIt.
    joints: [j1, j2, j3, j4, j5, j6, joint_clamp_1]
    interfaces: [position, velocity]

arm_controller:
  ros__parameters:
    joints: [j1, j2, j3, j4, j5, j6]
    command_interfaces: [position]
    state_interfaces: [position, velocity]
    allow_partial_joints_goal: false

gripper_controller:
  ros__parameters:
    joints: [joint_clamp_1]  # joint_clamp_2 mimics it (single motor)
    command_interfaces: [position]
    state_interfaces: [position, velocity]
    allow_partial_joints_goal: false
