# Real FR3 only (real_robot.launch.py). 0.35 rad/s = 20 deg/s per joint is the
# hard ceiling (about 11% of the FR3's 3.15 rad/s), about 0.2 m/s at the flange
# at full reach. RViz "Velocity Scaling" multiplies these; the default 0.9 gives
# ~0.32 rad/s = 18 deg/s = ~10% of the robot's max (user's choice 2026-10-30),
# and scaling 1.0 cannot go above the ceiling.
default_velocity_scaling_factor: 0.9
default_acceleration_scaling_factor: 0.9

joint_limits:
  j1: {has_velocity_limits: true, max_velocity: 0.35, has_acceleration_limits: true, max_acceleration: 0.5}
  j2: {has_velocity_limits: true, max_velocity: 0.35, has_acceleration_limits: true, max_acceleration: 0.5}
  j3: {has_velocity_limits: true, max_velocity: 0.35, has_acceleration_limits: true, max_acceleration: 0.5}
  j4: {has_velocity_limits: true, max_velocity: 0.35, has_acceleration_limits: true, max_acceleration: 0.5}
  j5: {has_velocity_limits: true, max_velocity: 0.35, has_acceleration_limits: true, max_acceleration: 0.5}
  j6: {has_velocity_limits: true, max_velocity: 0.35, has_acceleration_limits: true, max_acceleration: 0.5}
  joint_clamp_1: {has_velocity_limits: true, max_velocity: 0.1, has_acceleration_limits: true, max_acceleration: 0.5}
  joint_clamp_2: {has_velocity_limits: true, max_velocity: 0.1, has_acceleration_limits: true, max_acceleration: 0.5}
