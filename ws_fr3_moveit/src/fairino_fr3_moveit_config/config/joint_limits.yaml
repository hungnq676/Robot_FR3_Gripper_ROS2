default_velocity_scaling_factor: 0.1
default_acceleration_scaling_factor: 0.1

# Acceleration limits are required by the Pilz planner (PTP). 1.0 rad/s^2 is the
# value MoveIt's time parameterisation already used by default for the arm.
joint_limits:
  j1: {has_velocity_limits: true, max_velocity: 3.15, has_acceleration_limits: true, max_acceleration: 1.0}
  j2: {has_velocity_limits: true, max_velocity: 3.15, has_acceleration_limits: true, max_acceleration: 1.0}
  j3: {has_velocity_limits: true, max_velocity: 3.15, has_acceleration_limits: true, max_acceleration: 1.0}
  j4: {has_velocity_limits: true, max_velocity: 3.2, has_acceleration_limits: true, max_acceleration: 1.0}
  j5: {has_velocity_limits: true, max_velocity: 3.2, has_acceleration_limits: true, max_acceleration: 1.0}
  j6: {has_velocity_limits: true, max_velocity: 3.2, has_acceleration_limits: true, max_acceleration: 1.0}
  joint_clamp_1: {has_velocity_limits: true, max_velocity: 0.1, has_acceleration_limits: true, max_acceleration: 0.5}
  joint_clamp_2: {has_velocity_limits: true, max_velocity: 0.1, has_acceleration_limits: true, max_acceleration: 0.5}
